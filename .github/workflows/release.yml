name: Release Build & Publish

# Tag v* builds every platform and creates a DRAFT GitHub Release (never
# published automatically). Test tags vX.Y.Z-ci.N skip the pubspec match and
# create a draft prerelease. workflow_dispatch builds one platform and only
# uploads workflow artifacts; it never creates a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: windows
        type: choice
        options: [windows, linux, android, all]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.platform || 'tag' }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Version, analyze and tests
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.v.outputs.label }}
      numeric: ${{ steps.v.outputs.numeric }}
      formal: ${{ steps.v.outputs.formal }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      windows: ${{ steps.p.outputs.windows }}
      windows_arm64: ${{ steps.p.outputs.windows_arm64 }}
      linux: ${{ steps.p.outputs.linux }}
      android: ${{ steps.p.outputs.android }}
      win_matrix: ${{ steps.p.outputs.win_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, so the build-number guard can read the
          # pubspec.yaml of every earlier release tag.
          fetch-depth: 0

      - name: Resolve version and release mode
        id: v
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          line=$(grep '^version:' pubspec.yaml | head -n1)
          if [[ ! "$line" =~ ^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)[[:space:]]*$ ]]; then
            echo "pubspec.yaml must declare version X.Y.Z+N"; exit 1
          fi
          version="${BASH_REMATCH[1]}"; build="${BASH_REMATCH[2]}"
          formal=false; prerelease=false
          if [ "$EVENT" = push ]; then
            if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-ci\.[0-9]+$ ]]; then
              label="${TAG#v}"; prerelease=true
              echo "CI test tag: draft prerelease, pubspec match skipped."
            elif [ "$TAG" = "v$version" ] || [ "$TAG" = "v$version+$build" ]; then
              label="$version"; formal=true
            else
              echo "Tag $TAG does not match pubspec.yaml version $version+$build"; exit 1
            fi
          else
            label="$version-dev.$RUN"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "numeric=$version" >> "$GITHUB_OUTPUT"
          echo "formal=$formal" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Release label: $label (formal=$formal)"

      - name: Require a newer version and build number than earlier releases
        if: steps.v.outputs.formal == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/check_build_number.py --tag "$TAG"

      - name: Require a complete changelog entry
        if: steps.v.outputs.formal == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/changelog_notes.py check --tag "$TAG"

      - name: Select platforms
        id: p
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          for p in windows windows_arm64 linux android; do
            want=false
            if [ "$EVENT" = push ] || [ "$PLATFORM" = all ] || [ "${PLATFORM//-/_}" = "$p" ]; then want=true; fi
            # Windows ARM64 is not built: Flutter 3.32.8 ships no arm64 Windows
            # SDK and does not recognise Visual Studio 2026 on windows-11-arm
            # (falls back to "Visual Studio 16 2019" and x64 engine artifacts).
            [ "$p" = windows_arm64 ] && want=false
            echo "$p=$want" >> "$GITHUB_OUTPUT"
            declare "want_$p=$want"
          done
          items=()
          [ "$want_windows" = true ] && items+=('{"arch":"x64","runner":"windows-2022","ncnn":"windows-x64"}')
          [ "$want_windows_arm64" = true ] && items+=('{"arch":"arm64","runner":"windows-11-arm","ncnn":"windows-arm64"}')
          json=$(IFS=,; echo "{\"include\":[${items[*]}]}")
          echo "win_matrix=$json" >> "$GITHUB_OUTPUT"
          echo "Windows matrix: $json"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Require the pinned Flutter revision
        run: flutter --version --machine | node scripts/verify_flutter_version.js

      - name: Analyze and test
        if: github.event_name == 'push'
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Release script regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  build-windows:
    name: Windows ${{ matrix.arch }}
    needs: preflight
    if: needs.preflight.outputs.windows == 'true' || needs.preflight.outputs.windows_arm64 == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.win_matrix) }}
    runs-on: ${{ matrix.runner }}
    # ARM64 is best effort: a failure there is reported but does not block x64.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache ncnn
        id: ncnn
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ncnn
          key: ncnn-${{ matrix.ncnn }}-${{ hashFiles('third_party/ncnn_pin.txt', 'scripts/ci/build_ncnn.sh') }}

      - name: Build ncnn
        if: steps.ncnn.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/ci/build_ncnn.sh ${{ matrix.ncnn }} "$(cygpath -m '${{ runner.temp }}/ncnn')"

      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      # No arm64 Windows SDK archive exists for the pinned version, so clone the
      # same tag and let the tool bootstrap its arm64 Dart SDK.
      - name: Install Flutter 3.32.8 from git (arm64)
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          git clone --filter=blob:none -b stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout -q -B stable 3.32.8
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Require the pinned Flutter revision
        shell: bash
        run: flutter --version --machine | node scripts/verify_flutter_version.js

      - name: Build Windows release with the OCR runtime
        shell: bash
        run: |
          set -euo pipefail
          root="$(cygpath -m '${{ runner.temp }}/ncnn')"
          export WP17_OCR_NCNN_DIR="$root/install/lib/cmake/ncnn"
          export WP17_OCR_STB_DIR="$root/third_party"
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release --no-pub
          bundle="build/windows/${{ matrix.arch }}/runner/Release"
          for f in compoise.exe compoise_ocr.dll flutter_windows.dll data/app.so; do
            test -f "$bundle/$f" || { echo "Missing $bundle/$f"; exit 1; }
          done
          if ls "$bundle" | grep -Ei '\.(param|bin)$|ppocr'; then echo "OCR models must not be bundled"; exit 1; fi
          echo "BUNDLE=$bundle" >> "$GITHUB_ENV"

      - name: Package portable ZIP and NSIS installer
        shell: pwsh
        env:
          LABEL: ${{ needs.preflight.outputs.label }}
          NUMERIC: ${{ needs.preflight.outputs.numeric }}
          ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist/compoise-$env:LABEL-windows-$env:ARCH-portable.zip"
          Compress-Archive -Path "$env:BUNDLE/*" -DestinationPath $zip
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsis) { $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress; $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          $src = (Resolve-Path $env:BUNDLE).Path
          $out = Join-Path (Resolve-Path dist).Path "compoise-$env:LABEL-windows-$env:ARCH-setup.exe"
          & $nsis /V2 "/DVERSION=$env:NUMERIC" "/DSRC_DIR=$src" "/DOUT_FILE=$out" "/DARCH=$env:ARCH" windows/installer/compoise.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  build-linux:
    name: Linux x64 (DEB, RPM, AppImage)
    needs: preflight
    if: needs.preflight.outputs.linux == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev \
            libsecret-1-dev libayatana-appindicator3-dev rpm ruby ruby-dev imagemagick
          sudo gem install --no-document fpm
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Cache ncnn
        id: ncnn
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ncnn
          key: ncnn-linux-x64-${{ hashFiles('third_party/ncnn_pin.txt', 'scripts/ci/build_ncnn.sh') }}

      - name: Build ncnn
        if: steps.ncnn.outputs.cache-hit != 'true'
        run: scripts/ci/build_ncnn.sh linux-x64 "${{ runner.temp }}/ncnn"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Require the pinned Flutter revision
        run: flutter --version --machine | node scripts/verify_flutter_version.js

      - name: Build Linux release with the OCR runtime
        env:
          WP17_OCR_NCNN_DIR: ${{ runner.temp }}/ncnn/install/lib/cmake/ncnn
          WP17_OCR_STB_DIR: ${{ runner.temp }}/ncnn/third_party
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release --no-pub
          test -f build/linux/x64/release/bundle/lib/libcompoise_ocr.so

      - name: Package DEB, RPM and AppImage
        run: scripts/ci/package_linux.sh build/linux/x64/release/bundle "${{ needs.preflight.outputs.label }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*
          if-no-files-found: error

  build-android:
    name: Android (split APKs + universal)
    needs: preflight
    if: needs.preflight.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache ncnn
        id: ncnn
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ncnn
          key: ncnn-android-3abi-${{ hashFiles('third_party/ncnn_pin.txt', 'scripts/ci/build_ncnn.sh') }}

      - name: Build ncnn for armeabi-v7a, arm64-v8a, x86_64
        if: steps.ncnn.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          for abi in armeabi-v7a arm64-v8a x86_64; do
            scripts/ci/build_ncnn.sh "android-$abi" "${{ runner.temp }}/ncnn"
          done

      # Save right away so a later packaging failure does not discard ncnn.
      - name: Save ncnn cache
        if: steps.ncnn.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ncnn
          key: ${{ steps.ncnn.outputs.cache-primary-key }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Require the pinned Flutter revision
        run: flutter --version --machine | node scripts/verify_flutter_version.js

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Configure signing
        id: sign
        env:
          FORMAL: ${{ needs.preflight.outputs.formal }}
          EVENT: ${{ github.event_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=""
          for n in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS ANDROID_RELEASE_CERT_SHA256; do
            [ -n "${!n:-}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            if [ "$EVENT" = push ]; then
              echo "Tag builds require release signing secrets:$missing. Refusing a debug-signed APK."; exit 1
            fi
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets missing; this manual build is DEBUG-SIGNED and not for distribution."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          chmod 600 android/app/release.jks
          {
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=release.jks"
          } > android/key.properties
          chmod 600 android/key.properties
          echo "mode=release" >> "$GITHUB_OUTPUT"
          echo "Release keystore configured from repository secrets. Values are not printed."

      - name: Build APKs with the OCR runtime
        env:
          REQUIRE_RELEASE_SIGNING: ${{ steps.sign.outputs.mode == 'release' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          flutter pub get
          {
            echo   # local.properties may lack a trailing newline
            echo "wp17OcrNcnnRoot=${{ runner.temp }}/ncnn"
            echo "wp17OcrStbDir=${{ runner.temp }}/ncnn/third_party"
          } >> android/local.properties
          test "$(grep -c '^wp17Ocr' android/local.properties)" = 2
          targets=android-arm,android-arm64,android-x64
          flutter build apk --release --no-pub --split-per-abi --target-platform "$targets"
          mkdir -p apk-split && cp build/app/outputs/flutter-apk/app-*-release.apk apk-split/
          flutter build apk --release --no-pub --target-platform "$targets"

      - name: Verify signatures and package
        env:
          MODE: ${{ steps.sign.outputs.mode }}
          LABEL: ${{ needs.preflight.outputs.label }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          suffix=""; [ "$MODE" = debug ] && suffix="-DEBUG-SIGNED"
          mkdir -p dist
          declare -A names=(
            [apk-split/app-armeabi-v7a-release.apk]=armeabi-v7a
            [apk-split/app-arm64-v8a-release.apk]=arm64-v8a
            [build/app/outputs/flutter-apk/app-release.apk]=universal
          )
          want="$(printf '%s' "${ANDROID_RELEASE_CERT_SHA256:-}" | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          for src in "${!names[@]}"; do
            abi="${names[$src]}"
            if [ "$abi" = universal ]; then libs="armeabi-v7a arm64-v8a x86_64"; else libs="$abi"; fi
            listing="$(unzip -l "$src")"
            for l in $libs; do
              grep -q "lib/$l/libcompoise_ocr.so" <<<"$listing" || { echo "$src lacks lib/$l/libcompoise_ocr.so"; exit 1; }
            done
            if grep -Eqi 'ppocr|\.ncnn\.(param|bin)' <<<"$listing"; then echo "$src bundles OCR models"; exit 1; fi
            "$apksigner" verify "$src"
            if [ "$MODE" = release ]; then
              got="$("$apksigner" verify --print-certs "$src" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
              [ -n "$want" ] && [ "$got" = "$want" ] || { echo "$src is not signed with the pinned release certificate"; exit 1; }
            fi
            cp "$src" "dist/compoise-$LABEL-android-$abi$suffix.apk"
          done
          ls -l dist

      - name: Remove release signing material
        if: always()
        run: rm -f android/key.properties android/app/release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  publish:
    name: Create draft GitHub Release
    needs: [preflight, build-windows, build-linux, build-android]
    if: always() && github.event_name == 'push' && needs.build-linux.result == 'success' && needs.build-android.result == 'success' && needs.build-windows.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls release | grep -q 'windows-x64-portable.zip' || { echo "Windows x64 is required"; exit 1; }
          ls release | grep -q 'windows-x64-setup.exe' || { echo "Windows x64 installer is required"; exit 1; }
          if ls release | grep -q DEBUG-SIGNED; then echo "Refusing to publish a debug-signed APK."; exit 1; fi
          {
            echo "tag=$TAG"
            echo "commit=$GITHUB_SHA"
            echo "flutter=3.32.8"
            echo "license=GPL-3.0-only"
            echo "windowsCodeSigning=Not code-signed"
            echo "androidSigning=release key, certificate SHA-256 pinned"
            echo "appDataDir=%APPDATA%\\Compoise\\Compoise"
            echo "ocr=native runtime bundled; models downloaded on demand and SHA-256 verified"
          } > release/RELEASE_METADATA.txt
          (cd release && sha256sum * > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          setup=$(ls release/compoise-*-windows-x64-setup.exe | head -1)
          VER=$(basename "$setup")
          VER=${VER#compoise-}
          VER=${VER%-windows-x64-setup.exe}
          [ -n "$VER" ] || { echo "Could not resolve version label from Windows setup artifact"; exit 1; }
          if ls release | grep -q 'windows-arm64-setup.exe'; then
            WIN_ARM64_ZH="另有 ARM64：\`compoise-${VER}-windows-arm64-setup.exe\` / \`…-portable.zip\`。"
            WIN_ARM64_EN="Also includes ARM64: \`compoise-${VER}-windows-arm64-setup.exe\` / \`…-portable.zip\`."
          else
            WIN_ARM64_ZH="本版本暂无 Windows ARM64。"
            WIN_ARM64_EN="Windows ARM64 is not included in this release."
          fi
          cat > notes.md <<NOTES
          ## 方寸 · Compoise ${TAG}

          方寸（Compoise）是一款本地优先的任务管理应用：以艾森豪威尔四象限理清轻重缓急，并支持日程安排。面向 Android 与 Windows，另提供 Linux 桌面预览版。

          ### 主要功能

          - **四象限任务**：按重要/紧急整理，支持多任务板、子项、截止日期与提醒
          - **日程页**：日/周视图，把任务拖到时间线安排时间
          - **截图本地识别**：从截图识别文字并导入为任务；识别在本机完成，首次使用需下载约 11 MB 模型
          - **可选 AI（自备密钥）**：分类、分组与拆解；普通待办可离线使用
          - **可选同步**：通过自己的 OneDrive 或 WebDAV（坚果云等）在设备间同步，可设同步密码端到端加密，不需要方寸账号；默认关闭
          - **备份**：通过 JSON 导入/导出

          ### 下载指引

          | 平台 | 下载哪个文件 |
          |---|---|
          | **Windows** | 安装版：\`compoise-${VER}-windows-x64-setup.exe\`；便携版：\`compoise-${VER}-windows-x64-portable.zip\`（解压后运行 \`compoise.exe\`）。${WIN_ARM64_ZH} |
          | **Android** | 一般手机选 \`…-android-arm64-v8a.apk\`；较旧 32 位手机选 \`…-android-armeabi-v7a.apk\`；不确定或模拟器/Chromebook 选 \`…-android-universal.apk\`。 |
          | **Linux x64** | Ubuntu / Debian：\`…-linux-amd64.deb\`；Fedora / openSUSE：\`…-linux-x86_64.rpm\`；其他发行版：\`…-linux-x86_64.AppImage\`。\`.deb\` 用 Debian 惯用的 \`amd64\` 命名，\`.rpm\` / AppImage 用 \`x86_64\`，都是 64 位 x86。 |

          **Windows 未签名说明**：目前安装包未做代码签名。若出现「Windows 已保护你的电脑」，请确认文件来自本 Releases 页面后，点击 **更多信息 → 仍要运行**。

          **校验**：下载同目录的 \`SHA256SUMS.txt\`，在解压/安装前执行：

          \`\`\`sh
          sha256sum -c SHA256SUMS.txt
          \`\`\`

          许可证：GPL-3.0-only。

          ---

          ## Compoise ${TAG}

          Compoise is a local-first task manager built around the Eisenhower matrix, with a planner/schedule view. Supported on Android and Windows, with a Linux desktop preview.

          ### Highlights

          - **Eisenhower matrix**: organize by importance/urgency; boards, sub-items, due dates, and reminders
          - **Planner**: day/week views; drag tasks onto the timeline
          - **Screenshot import (on-device OCR)**: turn screenshot text into tasks locally; first use downloads an ~11 MB model
          - **Optional AI (bring your own key)**: classify, group, and break down tasks; everyday todos work offline
          - **Optional sync**: sync between devices through your own OneDrive or WebDAV storage (such as Nutstore), with an optional sync password for end-to-end encryption; no Compoise account; off by default
          - **Backup**: import/export via JSON

          ### Which file to download

          | Platform | File |
          |---|---|
          | **Windows** | Installer: \`compoise-${VER}-windows-x64-setup.exe\`; portable: \`compoise-${VER}-windows-x64-portable.zip\` (run \`compoise.exe\` after unzip). ${WIN_ARM64_EN} |
          | **Android** | Most phones: \`…-android-arm64-v8a.apk\`; older 32-bit devices: \`…-android-armeabi-v7a.apk\`; unsure / emulator / Chromebook: \`…-android-universal.apk\`. |
          | **Linux x64** | Ubuntu/Debian: \`…-linux-amd64.deb\`; Fedora/openSUSE: \`…-linux-x86_64.rpm\`; other distros: \`…-linux-x86_64.AppImage\`. The \`.deb\` uses the Debian \`amd64\` name; \`.rpm\` / AppImage use \`x86_64\`—both are 64-bit x86. |

          **Unsigned Windows builds**: packages are not code-signed yet. If SmartScreen shows “Windows protected your PC”, confirm the file is from this Releases page, then choose **More info → Run anyway**.

          **Verify**:

          \`\`\`sh
          sha256sum -c SHA256SUMS.txt
          \`\`\`

          License: GPL-3.0-only.
          NOTES
          # The notes open with this version's CHANGELOG entry (What's new).
          python3 scripts/changelog_notes.py notes --tag "$TAG" > whats-new.md
          cat whats-new.md notes.md > notes-full.md
          mv notes-full.md notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          flags=(--draft --title "Compoise ${TAG}" --notes-file notes.md)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}" release/*
