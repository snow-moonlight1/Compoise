name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Windows candidate only; no signing secrets or publishing

# OS26 least privilege: the workflow may only read by default. The publish job
# is the single place that asks for contents:write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release tag and pubspec version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run candidate validator regressions
        run: python -m unittest discover -s scripts/tests -p "test_release_candidate.py" -v

      - name: Run Windows candidate audit regressions
        run: python -m unittest discover -s scripts/tests -p "test_wp28_r2_candidate_audit.py" -v

      - name: Verify tag against pubspec.yaml
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          if ($env:RELEASE_EVENT -eq 'push') {
            ./scripts/build_release.ps1 -Platform All -ExpectedTag $env:RELEASE_TAG -ValidateOnly
          } else {
            Write-Host 'Manual run: no tag to compare, validating pubspec.yaml only.'
            ./scripts/build_release.ps1 -Platform All -ValidateOnly
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'Release version, build number and tag are aligned; no artifact was written by this job.'
          Write-Host 'The plan covers Android and Windows. Android signing is reported here and enforced by build-android.'

  build-android:
    name: Build Android Release APK
    if: github.event_name == 'push'
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Require the OS24 Flutter revision
        shell: bash
        run: |
          set -euo pipefail
          flutter --version --machine | node scripts/verify_flutter_version.js

      - name: Require release signing credentials
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS ANDROID_RELEASE_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "Formal release builds must provide ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_RELEASE_CERT_SHA256."
              echo "Refusing to publish a debug-signed APK."
              exit 1
            fi
          done
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          chmod 600 android/app/release.jks
          {
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=release.jks"
          } > android/key.properties
          chmod 600 android/key.properties
          echo "Release keystore configured from repository secrets. Values are not printed."

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager="$(command -v sdkmanager)"
          else
            sdkmanager="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses

      - name: Install dependencies & verify
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Extract App Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          LINE=$(grep '^version:' pubspec.yaml | head -n 1 || true)
          VERSION=$(printf '%s' "$LINE" | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+).*/\1/')
          BUILD=$(printf '%s' "$LINE" | sed -E 's/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+).*/\1/')
          if [ -z "$VERSION" ] || [ -z "$BUILD" ]; then
            echo "pubspec.yaml must declare version X.Y.Z+N before a release can be staged."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "BUILD=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Build and validate Android Release APK
        shell: pwsh
        env:
          REQUIRE_RELEASE_SIGNING: 'true'
          RELEASE_TAG: ${{ github.ref_name }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          # Shared local gate requires apksigner, aapt2 and the pinned certificate.
          # Refusing to publish a debug-signed APK. Missing proof is fatal.
          ./scripts/build_release.ps1 -Platform Android -ExpectedTag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove release signing material
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties android/app/release.jks
          echo "Temporary signing material removed from the runner workspace."

      - name: Upload Android APK artifact and hash-bound signing proof
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: release_dist/compoise-v${{ steps.version.outputs.VERSION }}+${{ steps.version.outputs.BUILD }}/*
          if-no-files-found: error

  build-windows:
    name: Build Windows Portable Release
    needs: preflight
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Check pinned Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          flutter --version --machine | node scripts/verify_flutter_version.js

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies & verify
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Extract App Version
        id: version
        shell: pwsh
        run: |
          $line = (Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1)
          if ($line -notmatch '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)\s*$') {
            Write-Error 'pubspec.yaml must declare version X.Y.Z+N before a release can be staged.'
            exit 1
          }
          "VERSION=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "BUILD=$($Matches[2])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build and validate Windows portable candidate
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          $tag = "v${{ steps.version.outputs.VERSION }}+${{ steps.version.outputs.BUILD }}"
          if ($env:RELEASE_EVENT -eq 'push') { $tag = $env:RELEASE_TAG }
          # Shared identity gate checks appDataDir=Compoise/Compoise.
          ./scripts/build_release.ps1 -Platform Windows -ExpectedTag $tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows Portable artifact and hash-bound proof
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-zip
          path: release_dist/compoise-v${{ steps.version.outputs.VERSION }}+${{ steps.version.outputs.BUILD }}/*
          if-no-files-found: error

  build-linux:
    name: Validate Linux desktop release build
    if: github.event_name == 'push'
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libsecret-1-dev libayatana-appindicator3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Require the OS24 Flutter revision
        shell: bash
        run: |
          set -euo pipefail
          flutter --version --machine | node scripts/verify_flutter_version.js

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release bundle
        run: flutter build linux --release --no-pub

      - name: Verify the Linux preview bundle
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=build/linux/x64/release/bundle
          test -x "$BUNDLE/matrixflow_native" || { echo "Missing Linux executable: $BUNDLE/matrixflow_native"; exit 1; }
          test -f "$BUNDLE/data/app.so" || { echo "Missing $BUNDLE/data/app.so"; exit 1; }
          test -d "$BUNDLE/data/flutter_assets" || { echo "Missing $BUNDLE/data/flutter_assets"; exit 1; }
          du -sh "$BUNDLE"
          echo 'Linux stays a preview: this job proves the pinned toolchain still compiles the release bundle.'
          echo 'No Linux installer, archive or checksum is published, and the app is not started headless here.'

  publish-release:
    name: Publish GitHub Release draft
    needs: [preflight, build-android, build-windows, build-linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The only job that may write to the repository.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          path: build_outputs
          merge-multiple: false

      - name: Assemble the release artifact set with the shared validator
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          # No recursive globs or silent overwrite of stale/duplicate artifacts.
          # This fails without the Android signing proof bound to APK and commit.
          $commit = (git rev-parse HEAD).Trim()
          python scripts/release_candidate.py assemble --directory release_artifacts --inputs build_outputs --platform All --tag $env:RELEASE_TAG --commit $commit --android-cert-sha256 $env:ANDROID_RELEASE_CERT_SHA256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write the release notes with the real platform state
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          signer=$(python -c 'import json; print(json.load(open("release_artifacts/ANDROID_PROOF.json"))["evidence"]["apkSignatureCertSha256"])')
          cat > release_artifacts/RELEASE_NOTES.md <<EOF
          Draft prepared by the Compoise release workflow. Review it before publishing.

          Tag ${RELEASE_TAG}. The commit, toolchain and certificate are recorded in RELEASE_METADATA.txt.

          | Platform | Delivered as | Signing state |
          |---|---|---|
          | Android | compoise-vX.Y.Z+N-android.apk | Signed with the repository release keystore; certificate SHA-256 $signer. A debug-signed APK or a certificate that does not match the pinned fingerprint fails the build. |
          | Windows | compoise-vX.Y.Z+N-windows-portable.zip | Not code-signed: no Authenticode certificate is configured, so SmartScreen may warn. Extract the ZIP to any folder and run compoise.exe. |
          | Linux | no artifact | Preview. CI compiles the release bundle with the pinned toolchain to prove it still builds; there is no installer, no signature and no package channel. |

          - License: GPL-3.0-only. See LICENSE and assets/licenses/THIRD_PARTY_NOTICES.txt.
          - SHA256SUMS.txt covers both binaries, platform proofs, RELEASE_MANIFEST.txt, RELEASE_METADATA.txt and these notes. Check it with: sha256sum -c SHA256SUMS.txt
          - Tasks stay on the device. Export a v3 JSON backup from Settings before upgrading. Backup files do not transfer local credential state; old Windows credentials require reconfiguration. Install, in-place upgrade, backup round-trip and clean-start checks are listed in docs/RELEASE_VALIDATION.md; they are run against the merged product build, not this draft.
          EOF
          cat release_artifacts/RELEASE_NOTES.md

      - name: Seal and verify notes, manifest, metadata, proofs and SHA256SUMS
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          # One shared schema: commit is a full SHA; toolchain is pinned.
          # windowsCodeSigning=unsigned; linuxDesktop=preview only; license=GPL-3.0-only
          $commit = (git rev-parse HEAD).Trim()
          $gate = @('--directory', 'release_artifacts', '--platform', 'All', '--tag', $env:RELEASE_TAG, '--commit', $commit, '--android-cert-sha256', $env:ANDROID_RELEASE_CERT_SHA256)
          python scripts/release_candidate.py seal @gate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release_candidate.py verify @gate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_artifacts/SHA256SUMS.txt
            release_artifacts/RELEASE_METADATA.txt
            release_artifacts/RELEASE_MANIFEST.txt
            release_artifacts/RELEASE_NOTES.md
            release_artifacts/*_PROOF.json
            release_artifacts/*.apk
            release_artifacts/*.zip
          body_path: release_artifacts/RELEASE_NOTES.md
          generate_release_notes: true
          draft: true
          prerelease: false
