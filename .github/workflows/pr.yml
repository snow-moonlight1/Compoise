name: PR checks

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      run_platform_smoke:
        description: Run the real Windows notification and tray smoke
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and default tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Require the OS24 Flutter revision
        shell: bash
        run: |
          set -euo pipefail
          flutter --version --machine | node scripts/verify_flutter_version.js

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Default tests
        run: flutter test --no-pub

      - name: OCR preparation and bundle regressions
        run: python3 -m unittest discover -s native/ocr/tools -p 'test_ocr*.py'

      - name: Release candidate regressions
        run: python3 -m unittest discover -s scripts/tests -p test_release_candidate.py

      - name: Windows candidate audit regressions
        run: python3 -m unittest discover -s scripts/tests -p test_wp28_r2_candidate_audit.py

      - name: Record device smoke boundary
        shell: bash
        run: |
          echo "Real notification and tray smoke is not part of this PR check."
          echo "Hosted runners have no Android device and this job does not claim a Windows tray session."
          echo "The opt-in job stays skipped unless workflow_dispatch sets run_platform_smoke."
          echo "This record is not a passing smoke result."

  android-debug:
    name: Android debug APK without release signing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Require the OS24 Flutter revision
        shell: bash
        run: |
          set -euo pipefail
          flutter --version --machine | node scripts/verify_flutter_version.js

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager="$(command -v sdkmanager)"
          else
            sdkmanager="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android debug APK
        env:
          REQUIRE_RELEASE_SIGNING: 'false'
        run: flutter build apk --debug

  linux-desktop:
    name: Linux desktop build and mock integration test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libsecret-1-dev libayatana-appindicator3-dev xvfb

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Require the OS24 Flutter revision
        shell: bash
        run: |
          set -euo pipefail
          flutter --version --machine | node scripts/verify_flutter_version.js

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Mock integration test on Linux
        run: xvfb-run -a -s '-screen 0 1280x1024x24' env GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 flutter test --no-pub integration_test/app_test.dart -d linux

      - name: Build Linux release bundle
        run: flutter build linux --release --no-pub

  windows-debug:
    name: Windows debug build
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Require the OS24 Flutter revision
        shell: bash
        run: |
          set -euo pipefail
          flutter --version --machine | node scripts/verify_flutter_version.js

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Mock integration test
        run: flutter test --no-pub integration_test/app_test.dart

      - name: Windows upgrade and path regressions
        run: flutter test --no-pub test/wp28_windows_path_alias_test.dart test/wp28_u1_upgrade_test.dart test/wp28_u1_boundaries_test.dart test/wp28_u1_windows_plugin_test.dart test/wp28_u2_credentials_test.dart

      - name: Build Windows debug
        run: flutter build windows --debug

  platform-smoke:
    name: Real Windows notification and tray smoke
    if: github.event_name == 'workflow_dispatch' && inputs.run_platform_smoke
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Require the OS24 Flutter revision
        shell: bash
        run: |
          set -euo pipefail
          flutter --version --machine | node scripts/verify_flutter_version.js

      - name: Install dependencies
        run: flutter pub get

      - name: Run real notification and tray smoke
        shell: pwsh
        env:
          MATRIXFLOW_OS25_SMOKE_RESULT: ${{ runner.temp }}/os25-platform-smoke.txt
        run: |
          flutter run -d windows -t tool/os25_platform_smoke.dart --no-pub
          Get-Content "$env:MATRIXFLOW_OS25_SMOKE_RESULT"
