name: 功能建议 / Feature request
description: 提出新功能或改进 / Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你希望怎样 / What would you like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他做法 / Alternatives you considered
  - type: checkboxes
    id: platforms
    attributes:
      label: 相关平台 / Platforms
      options:
        - label: Android
        - label: Windows
        - label: Linux
