name: matrixflow_native
description: "Local-first Eisenhower matrix for Android, Windows, and Linux preview. Tasks stay on device; AI requests go to a user-configured endpoint."
publish_to: 'none'
version: 1.0.0+1

environment:
  # OS24 pin: Flutter 3.32.8 stable / Dart 3.8.1.
  # Lower bound stays on the untouched fallback SDK (Dart 3.8.0-197.0.dev).
  # This does not claim Flutter 3.16+ or untested intermediate SDKs.
  sdk: '>=3.8.0-197.0.dev <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.6.0
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^10.3.4
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  window_manager: ^0.5.2
  tray_manager: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.ico
    - assets/licenses/MaterialIcons_LICENSE.txt
    - assets/licenses/THIRD_PARTY_NOTICES.txt
