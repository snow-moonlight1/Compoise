
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MatrixFlow AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Nunito', 'sans-serif'],
            },
            colors: {
              // Dynamic Primary
              primary: 'var(--primary)',

              // Soft UI Colors
              bgLight: '#efeeee',
              bgDark: '#2d3748',
              
              // Accent Colors (Pastel)
              q1: '#ff6b6b', // Red
              q2: '#4ecdc4', // Teal
              q3: '#ffbe0b', // Yellow
              q4: '#a0aec0', // Grey
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --primary: #3b82f6; /* Default Blue */
      }

      body {
        transition: background-color 0.3s ease, color 0.3s ease;
        /* Prevent bounce on mobile */
        overscroll-behavior-y: none;
      }

      /* --- Neumorphism Utilities --- */
      
      /* Light Mode Neumorphism */
      .neu-flat {
        background: #efeeee;
        box-shadow: 6px 6px 12px #c5c5c5, -6px -6px 12px #ffffff;
        border: 1px solid rgba(255,255,255,0.4);
      }
      .neu-pressed {
        background: #efeeee;
        box-shadow: inset 6px 6px 12px #c5c5c5, inset -6px -6px 12px #ffffff;
      }
      .neu-btn {
        background: #efeeee;
        box-shadow: 5px 5px 10px #c5c5c5, -5px -5px 10px #ffffff;
        transition: all 0.2s ease;
      }
      .neu-btn:active {
        box-shadow: inset 5px 5px 10px #c5c5c5, inset -5px -5px 10px #ffffff;
        transform: translateY(1px);
      }

      /* Dark Mode Neumorphism */
      .dark .neu-flat {
        background: #2d3748;
        box-shadow: 6px 6px 12px #1f2632, -6px -6px 12px #3b485e;
        border: 1px solid rgba(255,255,255,0.05);
      }
      .dark .neu-pressed {
        background: #2d3748;
        box-shadow: inset 6px 6px 12px #1f2632, inset -6px -6px 12px #3b485e;
      }
      .dark .neu-btn {
        background: #2d3748;
        box-shadow: 5px 5px 10px #1f2632, -5px -5px 10px #3b485e;
      }
      .dark .neu-btn:active {
        box-shadow: inset 5px 5px 10px #1f2632, inset -5px -5px 10px #3b485e;
      }

      /* Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(156, 163, 175, 0.5);
        border-radius: 2px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-bgLight dark:bg-bgDark text-slate-700 dark:text-slate-200">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
